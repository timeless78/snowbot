<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880"><defs><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E9E6B"/></marker><marker id="a-carrot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF8A4D"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A3AEB9"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16202B"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F7FAE"/></marker></defs><rect width="1600" height="880" fill="#FFFFFF"/><text x="40" y="56" font-family="Noto Sans CJK KR" font-size="30" font-weight="700" fill="#16202B" text-anchor="start">차 상태가 스노봇을 바꾸는 길</text><text x="40" y="88" font-family="Noto Sans CJK KR" font-size="16" font-weight="400" fill="#4A5866" text-anchor="start">차 상태 세 가지(기어 · 운전 시간 · 경고등) → 앱이 먼저 말 걸기 + 서버가 대답 길이 · 내용 바꾸기</text><rect x="40" y="130" width="340" height="470" rx="18" fill="#EEF4F8"/><text x="62" y="168" font-family="Noto Sans CJK KR" font-size="21" font-weight="700" fill="#16202B" text-anchor="start">차 상태 세 가지</text><text x="62" y="194" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#4A5866" text-anchor="start">Vehicle SDK 2개(조회만) + 앱이 잰 시간</text><rect x="60" y="218" width="300" height="102" rx="14" fill="#FFFFFF" stroke="#2E9E6B" stroke-width="2"/><text x="82" y="260" font-family="Noto Sans CJK KR" font-size="18" font-weight="700" fill="#16202B" text-anchor="start">기어 P · R · N · D</text><text x="82" y="290" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#4A5866" text-anchor="start">바뀔 때마다 알려 줌 (Gear)</text><rect x="60" y="340" width="300" height="102" rx="14" fill="#FFFFFF" stroke="#2E9E6B" stroke-width="2"/><text x="82" y="382" font-family="Noto Sans CJK KR" font-size="18" font-weight="700" fill="#16202B" text-anchor="start">연속 운전 시간</text><text x="82" y="412" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#4A5866" text-anchor="start">P 에서 출발한 때부터 앱이 잼</text><rect x="60" y="462" width="300" height="102" rx="14" fill="#FFFFFF" stroke="#2E9E6B" stroke-width="2"/><text x="82" y="504" font-family="Noto Sans CJK KR" font-size="18" font-weight="700" fill="#16202B" text-anchor="start">운전자 주의 경고등</text><text x="82" y="534" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#4A5866" text-anchor="start">5초마다 물어봄 (Safety)</text><text x="62" y="625" font-family="Noto Sans CJK KR" font-size="13" font-weight="400" fill="#4A5866" text-anchor="start">에뮬레이터 Virtual Console 에 주의 경고등이 없어</text><text x="62" y="645" font-family="Noto Sans CJK KR" font-size="13" font-weight="400" fill="#4A5866" text-anchor="start">경고는 시험용 명령으로 확인했다</text><path d="M380,380 L440,380" fill="none" stroke="#2E9E6B" stroke-width="2.5" marker-end="url(#a-green)"/><rect x="440" y="290" width="250" height="180" rx="14" fill="#FFFFFF" stroke="#4F7FAE" stroke-width="2.5"/><text x="462" y="330" font-family="Noto Sans CJK KR" font-size="19" font-weight="700" fill="#16202B" text-anchor="start">차 상태 정리</text><text x="462" y="354" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#4A5866" text-anchor="start">CarState</text><text x="462" y="392" font-family="Noto Sans CJK KR" font-size="16" font-weight="400" fill="#16202B" text-anchor="start">기어 D · 운전 41분</text><text x="462" y="418" font-family="Noto Sans CJK KR" font-size="16" font-weight="400" fill="#16202B" text-anchor="start">경고 꺼짐</text><text x="462" y="450" font-family="Noto Sans CJK KR" font-size="13" font-weight="400" fill="#4A5866" text-anchor="start">같은 값이면 다시 안 알림</text><path d="M690,340 L730,340 L730,250 L770,250" fill="none" stroke="#2E9E6B" stroke-width="2.5" marker-end="url(#a-green)"/><path d="M690,420 L730,420 L730,570 L770,570" fill="none" stroke="#2E9E6B" stroke-width="2.5" marker-end="url(#a-green)"/><rect x="770" y="120" width="800" height="296" rx="18" fill="#FFFFFF" stroke="#2E9E6B" stroke-width="2"/><text x="786" y="160" font-family="Noto Sans CJK KR" font-size="20" font-weight="700" fill="#16202B" text-anchor="start">① 앱이 먼저 말 건다 — 앱 안 규칙</text><text x="786" y="186" font-family="Noto Sans CJK KR" font-size="14.5" font-weight="400" fill="#4A5866" text-anchor="start">인터넷이 끊겨도 화면 속 스노봇의 표정 · 말풍선으로 뜬다 · 목소리는 서버가 만든다</text><rect x="786" y="206" width="770" height="46" rx="8" fill="#EEF4F8"/><text x="802" y="236" font-family="Noto Sans CJK KR" font-size="15.5" font-weight="700" fill="#16202B" text-anchor="start">출발 (P → 주행)</text><text x="1092" y="236" font-family="Noto Sans CJK KR" font-size="15.5" font-weight="400" fill="#16202B" text-anchor="start">반가운 표정 + 인사</text><rect x="786" y="260" width="770" height="46" rx="8" fill="#FFFFFF"/><text x="802" y="290" font-family="Noto Sans CJK KR" font-size="15.5" font-weight="700" fill="#16202B" text-anchor="start">도착 (주행 → P)</text><text x="1092" y="290" font-family="Noto Sans CJK KR" font-size="15.5" font-weight="400" fill="#16202B" text-anchor="start">수고 인사 · 1시간 넘게 달렸으면 푹 쉬라고</text><rect x="786" y="314" width="770" height="46" rx="8" fill="#EEF4F8"/><text x="802" y="344" font-family="Noto Sans CJK KR" font-size="15.5" font-weight="700" fill="#16202B" text-anchor="start">주의 경고등 켜짐</text><text x="1092" y="344" font-family="Noto Sans CJK KR" font-size="15.5" font-weight="400" fill="#16202B" text-anchor="start">걱정 표정 + 쉼터 권유 (10분에 한 번)</text><rect x="786" y="368" width="770" height="46" rx="8" fill="#FFFFFF"/><text x="802" y="398" font-family="Noto Sans CJK KR" font-size="15.5" font-weight="700" fill="#16202B" text-anchor="start">운전 120분째, 그 뒤 60분마다</text><text x="1092" y="398" font-family="Noto Sans CJK KR" font-size="15.5" font-weight="400" fill="#16202B" text-anchor="start">졸린 표정 + "벌써 2시간째 운전 중이에요. 쉼터에서…"</text><rect x="770" y="440" width="800" height="262" rx="18" fill="#FFFFFF" stroke="#2E9E6B" stroke-width="2"/><text x="786" y="480" font-family="Noto Sans CJK KR" font-size="20" font-weight="700" fill="#16202B" text-anchor="start">② 서버가 대답을 바꾼다 — 대화 상황에 차 상태</text><text x="786" y="506" font-family="Noto Sans CJK KR" font-size="14.5" font-weight="400" fill="#4A5866" text-anchor="start">앱이 바뀔 때마다 car 메시지로 보낸다 (기어 · 운전 분 · 경고)</text><rect x="786" y="526" width="770" height="46" rx="8" fill="#EEF4F8"/><text x="802" y="556" font-family="Noto Sans CJK KR" font-size="15.5" font-weight="700" fill="#16202B" text-anchor="start">주행 중</text><text x="1092" y="556" font-family="Noto Sans CJK KR" font-size="15.5" font-weight="400" fill="#16202B" text-anchor="start">2문장, 30자 안팎 · 주차 중엔 3문장</text><rect x="786" y="580" width="770" height="46" rx="8" fill="#FFFFFF"/><text x="802" y="610" font-family="Noto Sans CJK KR" font-size="15.5" font-weight="700" fill="#16202B" text-anchor="start">경고 켜짐 · 2시간 넘음</text><text x="1092" y="610" font-family="Noto Sans CJK KR" font-size="15.5" font-weight="400" fill="#16202B" text-anchor="start">농담을 부탁해도 휴식 권유가 먼저</text><rect x="786" y="634" width="770" height="46" rx="8" fill="#EEF4F8"/><text x="802" y="664" font-family="Noto Sans CJK KR" font-size="15.5" font-weight="700" fill="#16202B" text-anchor="start">스노봇이 먼저 한 말</text><text x="1092" y="664" font-family="Noto Sans CJK KR" font-size="15.5" font-weight="400" fill="#16202B" text-anchor="start">10분 동안 기억 → "아까 쉬자고 했죠?"로 이어 감</text><rect x="40" y="732" width="1530" height="108" rx="14" fill="#FFFFFF" stroke="#EF8A4D" stroke-width="2" stroke-dasharray="9 6"/><text x="62" y="768" font-family="Noto Sans CJK KR" font-size="18" font-weight="700" fill="#EF8A4D" text-anchor="start">PT(12/3)까지 더할 것</text><text x="62" y="798" font-family="Noto Sans CJK KR" font-size="15.5" font-weight="400" fill="#16202B" text-anchor="start">NaviHelper — 휴식 권유에 "응" 하면 쉼터를 경유지로 추가 · 회전 안내 중엔 말 멈춤</text><text x="62" y="824" font-family="Noto Sans CJK KR" font-size="15.5" font-weight="400" fill="#16202B" text-anchor="start">HVAC — 내기 순환이 오래 + 스노봇 CO₂ 센서 값이 높음 → 환기 권유 · CarUxRestrictions — 주행 규제에 맞춰 화면 줄이기</text></svg>