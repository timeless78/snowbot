<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><defs><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E9E6B"/></marker><marker id="a-carrot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF8A4D"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A3AEB9"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16202B"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F7FAE"/></marker></defs><rect width="1600" height="960" fill="#FFFFFF"/><text x="40" y="56" font-family="Noto Sans CJK KR" font-size="30" font-weight="700" fill="#16202B" text-anchor="start">스노봇 시스템 구성도</text><text x="40" y="88" font-family="Noto Sans CJK KR" font-size="16" font-weight="400" fill="#4A5866" text-anchor="start">2026-10-28 기준 · Pleos 에뮬레이터와 클라우드 서버에서 동작 확인</text><path d="M1085,62 L1129,62" fill="none" stroke="#2E9E6B" stroke-width="3"/><text x="1139" y="67" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#4A5866" text-anchor="start">지금 동작</text><path d="M1250,62 L1294,62" fill="none" stroke="#EF8A4D" stroke-width="3" stroke-dasharray="9 6"/><text x="1304" y="67" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#4A5866" text-anchor="start">PT(12/3)까지</text><path d="M1415,62 L1459,62" fill="none" stroke="#A3AEB9" stroke-width="3" stroke-dasharray="3 5"/><text x="1469" y="67" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#4A5866" text-anchor="start">이후</text><rect x="40" y="120" width="540" height="690" rx="18" fill="#EEF4F8"/><text x="62" y="156" font-family="Noto Sans CJK KR" font-size="21" font-weight="700" fill="#16202B" text-anchor="start">차 안</text><text x="120.3" y="156" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#4A5866" text-anchor="start">Pleos Connect</text><rect x="60" y="176" width="500" height="304" rx="14" fill="#FFFFFF" stroke="#4F7FAE" stroke-width="2.5"/><text x="84" y="214" font-family="Noto Sans CJK KR" font-size="20" font-weight="700" fill="#16202B" text-anchor="start">스노봇 차량 앱</text><text x="226" y="214" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#4A5866" text-anchor="start">Kotlin · 에뮬레이터에서 실행</text><circle cx="86" cy="252" r="5" fill="#2E9E6B"/><text x="102" y="258" font-family="Noto Sans CJK KR" font-size="17" font-weight="700" fill="#16202B" text-anchor="start">차 상태 읽기</text><text x="102" y="281" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#4A5866" text-anchor="start">기어 · 연속 운전 시간 · 주의 경고등(5초마다)</text><circle cx="86" cy="308" r="5" fill="#2E9E6B"/><text x="102" y="314" font-family="Noto Sans CJK KR" font-size="17" font-weight="700" fill="#16202B" text-anchor="start">먼저 말 걸기 — 앱 안 규칙</text><text x="102" y="337" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#4A5866" text-anchor="start">출발 · 도착 · 주의 경고 · 2시간 휴식</text><circle cx="86" cy="364" r="5" fill="#2E9E6B"/><text x="102" y="370" font-family="Noto Sans CJK KR" font-size="17" font-weight="700" fill="#16202B" text-anchor="start">말하기 · 듣기</text><text x="102" y="393" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#4A5866" text-anchor="start">말하기 버튼 → 마이크(16kHz) · 차 스피커로 재생</text><circle cx="86" cy="420" r="5" fill="#2E9E6B"/><text x="102" y="426" font-family="Noto Sans CJK KR" font-size="17" font-weight="700" fill="#16202B" text-anchor="start">화면 속 스노봇</text><text x="102" y="449" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#4A5866" text-anchor="start">표정 · 말풍선 · 주행 중엔 버튼 숨김</text><rect x="60" y="548" width="240" height="142" rx="14" fill="#FFFFFF" stroke="#2E9E6B" stroke-width="2"/><text x="80" y="580" font-family="Noto Sans CJK KR" font-size="18" font-weight="700" fill="#16202B" text-anchor="start">Vehicle SDK</text><text x="80" y="610" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#16202B" text-anchor="start">Gear — 주행 / 주차</text><text x="80" y="635" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#16202B" text-anchor="start">Safety — 주의 경고등</text><text x="80" y="660" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#16202B" text-anchor="start">(운전 시간은 기어로 앱이 잼)</text><path d="M180,548 L180,484" fill="none" stroke="#2E9E6B" stroke-width="2.5" marker-end="url(#a-green)"/><rect x="184" y="507" width="80.89999999999999" height="22" rx="4" fill="#EEF4F8"/><text x="190" y="522" font-family="Noto Sans CJK KR" font-size="13" font-weight="400" fill="#4A5866" text-anchor="start">조회 권한만</text><rect x="320" y="548" width="240" height="142" rx="14" fill="#FFFFFF" stroke="#EF8A4D" stroke-width="2" stroke-dasharray="9 6"/><text x="340" y="580" font-family="Noto Sans CJK KR" font-size="18" font-weight="700" fill="#16202B" text-anchor="start">Gleo AI (차량 비서)</text><text x="340" y="610" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#16202B" text-anchor="start">Gleo Interface 로</text><text x="340" y="635" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#16202B" text-anchor="start">ask_snowbot ·</text><text x="340" y="660" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#16202B" text-anchor="start">snowbot_status 부르기</text><path d="M440,548 L440,484" fill="none" stroke="#EF8A4D" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#a-carrot)"/><rect x="60" y="712" width="500" height="76" rx="14" fill="#FFFFFF" stroke="#EF8A4D" stroke-width="2" stroke-dasharray="9 6"/><text x="80" y="744" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#16202B" text-anchor="start">NaviHelper — 쉼터 경유지 추가 · 회전 안내 중 말 멈춤</text><text x="80" y="770" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#16202B" text-anchor="start">HVAC — 내기 순환이 오래 + CO₂ 높음 → 환기 권유</text><rect x="720" y="120" width="410" height="690" rx="18" fill="#EEF4F8"/><text x="742" y="156" font-family="Noto Sans CJK KR" font-size="21" font-weight="700" fill="#16202B" text-anchor="start">클라우드 스노봇 서버</text><text x="953.6" y="156" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#4A5866" text-anchor="start">NAVER Cloud VM</text><rect x="740" y="180" width="370" height="70" rx="14" fill="#FFFFFF" stroke="#2E9E6B" stroke-width="2"/><text x="760" y="210" font-family="Noto Sans CJK KR" font-size="16" font-weight="700" fill="#16202B" text-anchor="start">Caddy — 암호화 연결(TLS) 입구</text><text x="760" y="236" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#4A5866" text-anchor="start">바깥에는 https · wss 만 열림</text><rect x="740" y="270" width="370" height="314" rx="14" fill="#FFFFFF" stroke="#2E9E6B" stroke-width="2.5"/><text x="760" y="306" font-family="Noto Sans CJK KR" font-size="18" font-weight="700" fill="#16202B" text-anchor="start">중계 서버 (FastAPI WebSocket)</text><circle cx="764" cy="344" r="5" fill="#2E9E6B"/><text x="780" y="350" font-family="Noto Sans CJK KR" font-size="17" font-weight="700" fill="#16202B" text-anchor="start">인증 · 짝 맺기</text><text x="780" y="373" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#4A5866" text-anchor="start">QR 등록 코드 → 앱 토큰 · 기기 키</text><circle cx="764" cy="400" r="5" fill="#2E9E6B"/><text x="780" y="406" font-family="Noto Sans CJK KR" font-size="17" font-weight="700" fill="#16202B" text-anchor="start">차 상태 → 대화 상황</text><text x="780" y="429" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#4A5866" text-anchor="start">주행 중 2문장 · 주차 중 3문장</text><circle cx="764" cy="456" r="5" fill="#2E9E6B"/><text x="780" y="462" font-family="Noto Sans CJK KR" font-size="17" font-weight="700" fill="#16202B" text-anchor="start">대화 진행</text><text x="780" y="485" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#4A5866" text-anchor="start">표정 먼저 → 문장마다 목소리</text><circle cx="764" cy="512" r="5" fill="#2E9E6B"/><text x="780" y="518" font-family="Noto Sans CJK KR" font-size="17" font-weight="700" fill="#16202B" text-anchor="start">메시지 전달</text><text x="780" y="541" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#4A5866" text-anchor="start">차량 앱 ↔ 스노봇 로봇</text><rect x="740" y="604" width="370" height="184" rx="14" fill="#FFFFFF" stroke="#2E9E6B" stroke-width="2"/><text x="760" y="636" font-family="Noto Sans CJK KR" font-size="17" font-weight="700" fill="#16202B" text-anchor="start">보관하는 것</text><text x="760" y="668" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#16202B" text-anchor="start">기기 DB (SQLite) — 키 · 토큰은 해시만</text><text x="760" y="696" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#16202B" text-anchor="start">대화 기억 — 최근 8번, 메모리에만</text><text x="760" y="724" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#16202B" text-anchor="start">AI API 키 — 서버에만</text><text x="760" y="752" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#16202B" text-anchor="start">녹음 · 말 내용 — 저장 안 함</text><path d="M560,330 L740,330" fill="none" stroke="#2E9E6B" stroke-width="2.5" marker-end="url(#a-green)"/><rect x="591.78" y="302" width="116.44" height="23" rx="4" fill="#FFFFFF"/><text x="650" y="318" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#16202B" text-anchor="middle">차 상태 · 말소리</text><rect x="587.02" y="346" width="125.96000000000004" height="23" rx="4" fill="#FFFFFF"/><text x="650" y="362" font-family="Noto Sans CJK KR" font-size="14" font-weight="700" fill="#2E9E6B" text-anchor="middle">WebSocket (wss)</text><path d="M740,390 L560,390" fill="none" stroke="#2E9E6B" stroke-width="2.5" marker-end="url(#a-green)"/><rect x="578.76" y="402" width="142.48000000000002" height="23" rx="4" fill="#FFFFFF"/><text x="650" y="418" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#16202B" text-anchor="middle">표정 · 목소리 · 글자</text><rect x="1200" y="200" width="360" height="370" rx="18" fill="#EEF4F8"/><text x="1222" y="236" font-family="Noto Sans CJK KR" font-size="21" font-weight="700" fill="#16202B" text-anchor="start">외부 AI</text><text x="1303.82" y="236" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#4A5866" text-anchor="start">API</text><rect x="1218" y="256" width="324" height="84" rx="14" fill="#FFFFFF" stroke="#2E9E6B" stroke-width="2"/><text x="1238" y="291" font-family="Noto Sans CJK KR" font-size="17" font-weight="700" fill="#16202B" text-anchor="start">① 음성 인식</text><text x="1238" y="317" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#4A5866" text-anchor="start">ElevenLabs Scribe v2 Realtime</text><path d="M1110,298 L1218,298" fill="none" stroke="#2E9E6B" stroke-width="2.5" marker-end="url(#a-green)" marker-start="url(#a-green)"/><rect x="1218" y="356" width="324" height="84" rx="14" fill="#FFFFFF" stroke="#2E9E6B" stroke-width="2"/><text x="1238" y="391" font-family="Noto Sans CJK KR" font-size="17" font-weight="700" fill="#16202B" text-anchor="start">② 대답 · 표정 고르기</text><text x="1238" y="417" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#4A5866" text-anchor="start">Claude Haiku 5.5 (문장 단위로 받음)</text><path d="M1110,398 L1218,398" fill="none" stroke="#2E9E6B" stroke-width="2.5" marker-end="url(#a-green)" marker-start="url(#a-green)"/><rect x="1218" y="456" width="324" height="84" rx="14" fill="#FFFFFF" stroke="#2E9E6B" stroke-width="2"/><text x="1238" y="491" font-family="Noto Sans CJK KR" font-size="17" font-weight="700" fill="#16202B" text-anchor="start">③ 목소리</text><text x="1238" y="517" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#4A5866" text-anchor="start">ElevenLabs v4 Turbo · 목소리 Suzu</text><path d="M1110,498 L1218,498" fill="none" stroke="#2E9E6B" stroke-width="2.5" marker-end="url(#a-green)" marker-start="url(#a-green)"/><rect x="1305.23" y="583" width="149.54000000000002" height="22" rx="4" fill="#FFFFFF"/><text x="1380" y="598" font-family="Noto Sans CJK KR" font-size="13" font-weight="400" fill="#4A5866" text-anchor="middle">API 키는 서버에만 둔다</text><rect x="1200" y="620" width="360" height="190" rx="18" fill="#EEF4F8" stroke="#EF8A4D" stroke-width="2" stroke-dasharray="9 6"/><text x="1222" y="656" font-family="Noto Sans CJK KR" font-size="21" font-weight="700" fill="#16202B" text-anchor="start">스노봇 로봇</text><text x="1343.3" y="656" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#4A5866" text-anchor="start">XIAO ESP32-S3</text><text x="1222" y="690" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#16202B" text-anchor="start">서보 4개 — 눈꺼풀 · 눈썹 · 고개</text><text x="1222" y="718" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#16202B" text-anchor="start">마이크 · 스피커 · CO₂ · 온도 센서</text><text x="1222" y="746" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#4A5866" text-anchor="start">부품 11/7 도착 → 조립</text><text x="1222" y="774" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#4A5866" text-anchor="start">서버 쪽 연결은 가상 스노봇으로 시험 완료</text><path d="M1110,560 L1160,560 L1160,700 L1200,700" fill="none" stroke="#EF8A4D" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#a-carrot)" marker-start="url(#a-carrot)"/><rect x="1135.8" y="625" width="48.400000000000006" height="22" rx="4" fill="#FFFFFF"/><text x="1160" y="640" font-family="Noto Sans CJK KR" font-size="13" font-weight="700" fill="#EF8A4D" text-anchor="middle">Wi-Fi</text><path d="M310,810 L310,830 L1380,830 L1380,810" fill="none" stroke="#A3AEB9" stroke-width="2.5" stroke-dasharray="3 5" marker-end="url(#a-gray)" marker-start="url(#a-gray)"/><rect x="648.3199999999999" y="819" width="393.36" height="23" rx="4" fill="#FFFFFF"/><text x="845" y="835" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#4A5866" text-anchor="middle">블루투스 직접 연결 — 최종 목표: 차량 앱이 모듈 허브 (이후)</text><rect x="40" y="862" width="490" height="76" rx="12" fill="#EEF4F8"/><text x="60" y="892" font-family="Noto Sans CJK KR" font-size="17" font-weight="700" fill="#4F7FAE" text-anchor="start">AI 는 서버에서만</text><text x="60" y="920" font-family="Noto Sans CJK KR" font-size="14.5" font-weight="400" fill="#16202B" text-anchor="start">앱 · 로봇에는 API 키가 없다. AI 를 바꿔도 앱은 그대로</text><rect x="555" y="862" width="490" height="76" rx="12" fill="#EEF4F8"/><text x="575" y="892" font-family="Noto Sans CJK KR" font-size="17" font-weight="700" fill="#4F7FAE" text-anchor="start">인터넷이 끊겨도</text><text x="575" y="920" font-family="Noto Sans CJK KR" font-size="14.5" font-weight="400" fill="#16202B" text-anchor="start">출발 · 경고 · 휴식 알림은 앱 안 규칙으로 화면에 뜬다</text><rect x="1070" y="862" width="490" height="76" rx="12" fill="#EEF4F8"/><text x="1090" y="892" font-family="Noto Sans CJK KR" font-size="17" font-weight="700" fill="#4F7FAE" text-anchor="start">개인정보</text><text x="1090" y="920" font-family="Noto Sans CJK KR" font-size="14.5" font-weight="400" fill="#16202B" text-anchor="start">녹음 저장 안 함 · 서버 기록에 말 내용 없음(길이 · 소리 크기만)</text></svg>