<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050"><defs><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E9E6B"/></marker><marker id="a-carrot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF8A4D"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A3AEB9"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16202B"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F7FAE"/></marker></defs><rect width="1600" height="1050" fill="#FFFFFF"/><text x="40" y="56" font-family="Noto Sans CJK KR" font-size="30" font-weight="700" fill="#16202B" text-anchor="start">말 한마디가 지나가는 길</text><text x="40" y="88" font-family="Noto Sans CJK KR" font-size="16" font-weight="400" fill="#4A5866" text-anchor="start">운전자가 말하고 스노봇이 대답하기까지 · 모든 단계를 조각 단위로 흘려 보내 기다림을 줄인다</text><rect x="75" y="116" width="190" height="62" rx="12" fill="#EEF4F8" stroke="#16202B" stroke-width="2.5"/><text x="170" y="154" font-family="Noto Sans CJK KR" font-size="18" font-weight="700" fill="#16202B" text-anchor="middle">운전자</text><path d="M170,178 L170,1000" fill="none" stroke="#A3AEB9" stroke-width="1.5" stroke-dasharray="4 6"/><rect x="325" y="116" width="190" height="62" rx="12" fill="#FFFFFF" stroke="#4F7FAE" stroke-width="2.5"/><text x="420" y="154" font-family="Noto Sans CJK KR" font-size="18" font-weight="700" fill="#16202B" text-anchor="middle">차량 앱</text><path d="M420,178 L420,1000" fill="none" stroke="#A3AEB9" stroke-width="1.5" stroke-dasharray="4 6"/><rect x="625" y="116" width="190" height="62" rx="12" fill="#FFFFFF" stroke="#2E9E6B" stroke-width="2.5"/><text x="720" y="154" font-family="Noto Sans CJK KR" font-size="18" font-weight="700" fill="#16202B" text-anchor="middle">스노봇 서버</text><path d="M720,178 L720,1000" fill="none" stroke="#A3AEB9" stroke-width="1.5" stroke-dasharray="4 6"/><rect x="895" y="116" width="190" height="62" rx="12" fill="#FFFFFF" stroke="#2E9E6B" stroke-width="2.5"/><text x="990" y="143" font-family="Noto Sans CJK KR" font-size="18" font-weight="700" fill="#16202B" text-anchor="middle">음성 인식</text><text x="990" y="166" font-family="Noto Sans CJK KR" font-size="13" font-weight="400" fill="#4A5866" text-anchor="middle">Scribe v2</text><path d="M990,178 L990,1000" fill="none" stroke="#A3AEB9" stroke-width="1.5" stroke-dasharray="4 6"/><rect x="1135" y="116" width="190" height="62" rx="12" fill="#FFFFFF" stroke="#2E9E6B" stroke-width="2.5"/><text x="1230" y="143" font-family="Noto Sans CJK KR" font-size="18" font-weight="700" fill="#16202B" text-anchor="middle">대답 AI</text><text x="1230" y="166" font-family="Noto Sans CJK KR" font-size="13" font-weight="400" fill="#4A5866" text-anchor="middle">Claude Haiku 5.5</text><path d="M1230,178 L1230,1000" fill="none" stroke="#A3AEB9" stroke-width="1.5" stroke-dasharray="4 6"/><rect x="1365" y="116" width="190" height="62" rx="12" fill="#FFFFFF" stroke="#2E9E6B" stroke-width="2.5"/><text x="1460" y="143" font-family="Noto Sans CJK KR" font-size="18" font-weight="700" fill="#16202B" text-anchor="middle">목소리</text><text x="1460" y="166" font-family="Noto Sans CJK KR" font-size="13" font-weight="400" fill="#4A5866" text-anchor="middle">ElevenLabs</text><path d="M1460,178 L1460,1000" fill="none" stroke="#A3AEB9" stroke-width="1.5" stroke-dasharray="4 6"/><path d="M176,216 L414,216" fill="none" stroke="#16202B" stroke-width="2.2" marker-end="url(#a-ink)"/><rect x="212.7" y="191" width="164.6" height="23" rx="4" fill="#FFFFFF"/><text x="295" y="207" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#16202B" text-anchor="middle">말하기 버튼 누르고 말함</text><path d="M426,258 L714,258" fill="none" stroke="#4F7FAE" stroke-width="3.5" marker-end="url(#a-blue)"/><rect x="459.84" y="233" width="220.32000000000005" height="23" rx="4" fill="#FFFFFF"/><text x="570" y="249" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#16202B" text-anchor="middle">마이크 소리를 0.1초씩 바로 보냄</text><path d="M726,300 L984,300" fill="none" stroke="#2E9E6B" stroke-width="3.5" marker-end="url(#a-green)"/><rect x="795.8" y="275" width="118.39999999999999" height="23" rx="4" fill="#FFFFFF"/><text x="855" y="291" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#16202B" text-anchor="middle">그대로 흘려 보냄</text><path d="M984,340 L726,340" fill="none" stroke="#2E9E6B" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#a-green)"/><rect x="786.7" y="315" width="136.59999999999997" height="23" rx="4" fill="#FFFFFF"/><text x="855" y="331" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#16202B" text-anchor="middle">받아 적는 중인 글자</text><path d="M714,380 L426,380" fill="none" stroke="#2E9E6B" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#a-green)"/><rect x="497.36" y="355" width="145.28000000000003" height="23" rx="4" fill="#FFFFFF"/><text x="570" y="371" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#16202B" text-anchor="middle">화면에 글자 (heard)</text><path d="M176,428 L414,428" fill="none" stroke="#16202B" stroke-width="2.2" marker-end="url(#a-ink)"/><rect x="241.68" y="403" width="106.64" height="23" rx="4" fill="#FFFFFF"/><text x="295" y="419" font-family="Noto Sans CJK KR" font-size="14" font-weight="700" fill="#16202B" text-anchor="middle">버튼 뗌 = 말 끝</text><path d="M426,468 L714,468" fill="none" stroke="#4F7FAE" stroke-width="2.2" marker-end="url(#a-blue)"/><rect x="524.8" y="443" width="90.40000000000002" height="23" rx="4" fill="#FFFFFF"/><text x="570" y="459" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#16202B" text-anchor="middle">listen_end</text><path d="M984,508 L726,508" fill="none" stroke="#2E9E6B" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#a-green)"/><rect x="770.5999999999999" y="483" width="168.80000000000007" height="23" rx="4" fill="#FFFFFF"/><text x="855" y="499" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#16202B" text-anchor="middle">확정 글자 (0.2~0.35초)</text><rect x="550" y="524" width="340" height="114" rx="10" fill="#EEF4F8" stroke="#2E9E6B" stroke-width="2"/><text x="566" y="550" font-family="Noto Sans CJK KR" font-size="14.5" font-weight="700" fill="#16202B" text-anchor="start">상황 붙이기</text><text x="566" y="574" font-family="Noto Sans CJK KR" font-size="14.5" font-weight="400" fill="#16202B" text-anchor="start">차: 주행 중 · 운전 41분 · 경고 없음</text><text x="566" y="598" font-family="Noto Sans CJK KR" font-size="14.5" font-weight="400" fill="#16202B" text-anchor="start">스노봇이 먼저 한 말 · 최근 대화 8번</text><text x="566" y="624" font-family="Noto Sans CJK KR" font-size="14.5" font-weight="700" fill="#EF8A4D" text-anchor="start">→ 주행 중이면 2문장(30자 안팎)</text><path d="M726,668 L1224,668" fill="none" stroke="#16202B" stroke-width="2.2" marker-end="url(#a-ink)"/><rect x="901.66" y="643" width="146.68" height="23" rx="4" fill="#FFFFFF"/><text x="975" y="659" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#16202B" text-anchor="middle">질문 + 상황 + 문장 수</text><path d="M1224,708 L726,708" fill="none" stroke="#2E9E6B" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#a-green)"/><rect x="819.06" y="683" width="311.88000000000005" height="23" rx="4" fill="#FFFFFF"/><text x="975" y="699" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#16202B" text-anchor="middle">대답 맨 앞 표정 태그 [sleepy nod] — 오는 즉시</text><path d="M714,748 L426,748" fill="none" stroke="#2E9E6B" stroke-width="2.2" marker-end="url(#a-green)"/><rect x="480.84" y="723" width="178.32000000000008" height="23" rx="4" fill="#FFFFFF"/><text x="570" y="739" font-family="Noto Sans CJK KR" font-size="14" font-weight="700" fill="#2E9E6B" text-anchor="middle">표정 먼저 (reply_start)</text><path d="M1224,788 L726,788" fill="none" stroke="#2E9E6B" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#a-green)"/><rect x="898.58" y="763" width="152.84" height="23" rx="4" fill="#FFFFFF"/><text x="975" y="779" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#16202B" text-anchor="middle">첫 문장 — 다 쓰는 대로</text><path d="M726,828 L1454,828" fill="none" stroke="#16202B" stroke-width="2.2" marker-end="url(#a-ink)"/><rect x="1060.9" y="803" width="58.199999999999996" height="23" rx="4" fill="#FFFFFF"/><text x="1090" y="819" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#16202B" text-anchor="middle">첫 문장</text><path d="M1454,868 L726,868" fill="none" stroke="#2E9E6B" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#a-green)"/><rect x="1025.2" y="843" width="129.60000000000002" height="23" rx="4" fill="#FFFFFF"/><text x="1090" y="859" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#16202B" text-anchor="middle">목소리 조각 (PCM)</text><path d="M714,908 L426,908" fill="none" stroke="#2E9E6B" stroke-width="3.5" marker-end="url(#a-green)"/><rect x="510.8" y="883" width="118.39999999999999" height="23" rx="4" fill="#FFFFFF"/><text x="570" y="899" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#16202B" text-anchor="middle">목소리 흘려 보냄</text><path d="M414,948 L176,948" fill="none" stroke="#16202B" stroke-width="2.2" marker-end="url(#a-ink)"/><rect x="233.7" y="923" width="122.6" height="23" rx="4" fill="#FFFFFF"/><text x="295" y="939" font-family="Noto Sans CJK KR" font-size="14" font-weight="700" fill="#16202B" text-anchor="middle">차 스피커 첫 소리</text><rect x="444" y="971.5" width="511.95999999999987" height="23.5" rx="4" fill="#FFFFFF"/><text x="450" y="988" font-family="Noto Sans CJK KR" font-size="14.5" font-weight="400" fill="#4A5866" text-anchor="start">다음 문장도 같은 길로 이어 말하고, 끝에 글자와 걸린 시간(reply)을 보낸다</text><path d="M60,428 L44,428 L44,948 L60,948" fill="none" stroke="#EF8A4D" stroke-width="3"/><text x="32" y="688" font-family="Noto Sans CJK KR" font-size="16" font-weight="700" fill="#EF8A4D" text-anchor="middle" transform="rotate(-90 32 688)">말 끝 → 첫 소리 보통 1.5초 (17번 실측, 1.3~2.5초)</text><text x="40" y="1030" font-family="Noto Sans CJK KR" font-size="14.5" font-weight="400" fill="#4A5866" text-anchor="start">실물 스노봇이 연결돼 있으면 같은 표정 명령과 목소리가 로봇으로도 간다. 대답 AI 가 실패하거나 못 들었으면 정해 둔 말(걱정 표정)로 대신한다.</text></svg>